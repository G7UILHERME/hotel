<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Quarto de Hotel</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <main class="pagina-cadastro">

        <div class="cadastro-card">

            <h1>Cadastro de Quarto</h1>

            <form action="salvar_quarto.php" method="POST">

                <label for="id_hotel">Hotel:</label>
                <select id="id_hotel" name="id_hotel" required>
                    <option value="">Selecione um hotel</option>
                    <option value="1">Hotel Estelar - RJ</option>
                    <option value="2">Hotel Gabiru - RS</option>
                    <option value="3">Hotel Ludo - SP</option>
                    <option value="4">Hotel Caçapa - MG</option>
                    <option value="5">Hotel Giants - BA</option>
                    <option value="6">Hotel Lelec- ES</option>
                </select>

                <br><br>

                <label for="numero_quarto">Número do quarto:</label>
                <input
                    type="text"
                    id="numero_quarto"
                    name="numero_quarto"
                    placeholder="Ex.: 10, 202-A"
                    required
                >

                <br><br>

                <label for="tipo_quarto">Tipo de quarto:</label>
                <input
                    type="text"
                    id="tipo_quarto"
                    name="tipo_quarto"
                    placeholder="Ex.: solteiro, casal, suíte luxo"
                    required
                >

                <br><br>

                <label for="preco_diaria">Preço diária (R$):</label>
                <input
                    type="number"
                    id="preco_diaria"
                    name="preco_diaria"
                    step="0.01"
                    min="0"
                    required
                >

                <br><br>

                <button type="submit">Salvar quarto</button>

            </form>

            <br>

            <a href="listar_quartos.php">Listar quartos</a>

            <br><br>

            <a href="logout_hotel.php">Sair / Desligar do sistema</a>

        </div>

    </main>

</body>
</html>
